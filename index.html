<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="description" content="神農生活與食習會員服務入口">
  <title>神農生活 × 食習</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230A59A1'/%3E%3Cpath d='M15 34l11-9 8 6 15-14' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f4f1ea;
      --white: #fff;
      --ink: #202020;
      --muted: #76736e;
      --line: #d8d4cc;
      --blue: #0a59a1;
      --blue-deep: #08477f;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100%, 760px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 22px max(32px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    .intro {
      padding: 18px 4px 26px;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #88847d;
      font-size: 0.75rem;
      letter-spacing: 0.22em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 500;
      line-height: 1.22;
      letter-spacing: 0.01em;
    }

    .lead {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.75;
    }

    .destinations {
      display: grid;
      gap: 18px;
    }

    .card {
      position: relative;
      display: block;
      width: 100%;
      min-height: 224px;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--white);
      text-decoration: none;
      color: inherit;
      text-align: left;
      font: inherit;
      cursor: pointer;
      appearance: none;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .card:active { transform: scale(0.992); }

    .card:focus-visible {
      outline: 3px solid rgba(10, 89, 161, 0.32);
      outline-offset: 4px;
    }

    .brand-window {
      height: 126px;
      display: grid;
      place-items: center;
      padding: 18px 24px;
      background: var(--white);
      border-bottom: 1px solid var(--line);
    }

    .brand-window img {
      display: block;
      width: auto;
      height: auto;
      max-width: 76%;
      max-height: 70%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    /* The supplied JPG files have uneven internal whitespace. These optical
       offsets center the visible marks inside the white logo panels. */
    .maji .brand-window img { transform: translateY(-16px); }
    .member .brand-window img { transform: translateY(-20px); }

    .card-footer {
      min-height: 97px;
      padding: 17px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .maji .card-footer {
      color: var(--white);
      background: var(--blue);
      border-color: var(--blue);
    }

    .member .card-footer { background: #efede8; }

    .card-copy strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .card-copy span {
      color: inherit;
      opacity: 0.7;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .arrow {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border: 1px solid currentColor;
      display: grid;
      place-items: center;
      font-size: 1.35rem;
      line-height: 1;
    }

    .footnote {
      margin: auto 0 0;
      padding: 26px 4px 0;
      color: #99958e;
      font-size: 0.76rem;
      letter-spacing: 0.12em;
    }

    dialog {
      width: min(calc(100% - 40px), 420px);
      padding: 0;
      border: 0;
      color: var(--ink);
      background: var(--white);
      box-shadow: 0 24px 80px rgba(0,0,0,.22);
    }

    dialog::backdrop { background: rgba(15, 22, 28, 0.48); }

    .dialog-inner { padding: 28px; }

    .dialog-inner h2 { margin: 0 0 12px; font-size: 1.5rem; font-weight: 500; }
    .dialog-inner p { margin: 0 0 24px; color: var(--muted); line-height: 1.7; }
    .dialog-inner button {
      width: 100%;
      min-height: 48px;
      border: 0;
      color: var(--white);
      background: var(--blue);
      font: inherit;
      cursor: pointer;
    }

    @media (min-width: 720px) {
      .page { padding-inline: 34px; }
      .destinations { grid-template-columns: 1fr 1fr; }
      .card { min-height: 340px; }
      .brand-window { height: 210px; }
      .card-footer { min-height: 129px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
